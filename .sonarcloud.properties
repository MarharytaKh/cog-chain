# SonarQube Cloud automatic analysis settings
# Generated or tool-produced files are not part of the source code:
#   _site/         - DocFX output, rebuilt from docs/*.md
#   UpgradeLog.htm - Visual Studio project migration report
#   .vs/, Backup/  - IDE state and project backups
sonar.exclusions=_site/**,UpgradeLog.htm,.vs/**,Backup/**
